{% extends 'base.html' %}

{% block title %}Página No Encontrada - 404{% endblock %}

{% block content %}
<div class="container py-5 text-center my-auto">
    <div class="row justify-content-center py-5">
        <div class="col-md-8 col-lg-6">
            <!-- Número de error con el azul oscuro de la paleta -->
            <div class="display-1 fw-bold text-primary-custom mb-2">404</div>
            <div class="mb-4">
                <i class="bi bi-exclamation-triangle-fill text-warning display-4"></i>
            </div>
            <h2 class="fw-bold mb-3">Página no encontrada</h2>
            <p class="text-muted mb-4">
                El recurso o la dirección que intentas consultar no existe, fue movida o no se encuentra disponible temporalmente dentro del sistema.
            </p>
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'home' %}" class="btn btn-primary-custom px-4 shadow-sm">
                    <i class="bi bi-house-door me-2"></i>Volver al Inicio
                </a>
                <button onclick="window.history.back();" class="btn btn-outline-secondary px-4">
                    <i class="bi bi-arrow-left me-2"></i>Página Anterior
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
